  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb; --surface: #ffffff; --text: #111722; --text-soft: #596474; --line: #e1e6ee;
      --blue: #286cff; --blue-deep: #164dd5;
      --shadow: 0 18px 48px rgba(20, 42, 90, .12), 0 3px 10px rgba(20, 42, 90, .06);
      --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: "Bricolage Grotesque", var(--font);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0f17; --surface: #141a24; --text: #f4f6fa; --text-soft: #a4afbf; --line: #222c3a; --blue: #5a8cff; --blue-deep: #316ff4;
        --shadow: 0 20px 56px rgba(0, 0, 0, .35), 0 3px 10px rgba(0, 0, 0, .22); }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
    .wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; font: 700 1.05rem/1 var(--display); }
    .brand img { width: 30px; height: 30px; border-radius: 8px; }
    .brand b { color: var(--blue); font-weight: 700; }
    h1 { font: 700 1.6rem/1.1 var(--display); letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance; }
    p { margin: 0; color: var(--text-soft); }
    .player { position: relative; border-radius: 22px; overflow: hidden; background: #000; box-shadow: var(--shadow); aspect-ratio: 9 / 16; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .cta { display: block; text-align: center; background: var(--blue); color: #fff; text-decoration: none; font-weight: 600;
      border-radius: 14px; padding: 15px 16px; font-size: 1.02rem; }
    .cta:active { background: var(--blue-deep); }
    .fine { text-align: center; font-size: .88rem; }
  </style>
